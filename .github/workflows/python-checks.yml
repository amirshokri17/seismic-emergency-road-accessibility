name: Python source checks

on:
  push:
  pull_request:

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source (ArcPy not needed to compile)
        run: python -m compileall -q scripts tests
      - name: Test extracted routing core and publication safeguards
        run: python -m unittest discover -s tests -v